<!DOCTYPE html>
<html>
<head>
<title>Random Image Display</title>
<style>
body {
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
margin: 0;
background-color: #f0f0f0;
}
img {
max-width: 90%;
max-height: 90%;
border: 1px solid #ccc;
}
</style>
</head>
<body>

<img id="randomImage" src="" alt="Random Image">


<script>
const images = [
  "Clue-14_Farhan.png",
  "Ratul-clue-14.jpg",
  "Clue-8_Farhan.png",
  "Clue-16_Farhan.png",
  "Clue 13.1_samia.png",
  "Clue-9_Farhan.png"
];

let lastImage = null;
let repeatCount = 0;
const maxRepeats = 2;

function getValidRandomImage() {
  let availableImages = images.filter(img => img !== lastImage || repeatCount < maxRepeats);

  // If only one image is available and it’s the one we've repeated enough, we must choose from all
  if (availableImages.length === 0) {
    availableImages = images.filter(img => img !== lastImage);
  }

  const selectedImage = availableImages[Math.floor(Math.random() * availableImages.length)];

  if (selectedImage === lastImage) {
    repeatCount++;
  } else {
    lastImage = selectedImage;
    repeatCount = 1;
  }

  return selectedImage;
}

function displayRandomImage() {
  const imageElement = document.getElementById("randomImage");
  imageElement.src = getValidRandomImage();
}

window.onload = function() {
  displayRandomImage(); // Call displayRandomImage
   if (sessionStorage.getItem('refreshCount') === null) {
      sessionStorage.setItem('refreshCount', '0');
    }

    let refreshCount = parseInt(sessionStorage.getItem('refreshCount'));
    refreshCount++;
    sessionStorage.setItem('refreshCount', refreshCount.toString());

    if (refreshCount > 1) {
      document.body.innerHTML = "<h1>You have refreshed too many times!</h1>"; // basic
      //Or you can redirect the user.
      //window.location.href = "https://www.example.com/refresh-limit-reached";
    }
    else{
      document.body.innerHTML += "<p>Refresh Count: " + refreshCount + "</p>";
    }
};
</script>

</body>
</html>
